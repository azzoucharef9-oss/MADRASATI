<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دخول الأستاذ | أكاديمية التفوق</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body class="app-shell">
  <main class="auth-layout">
    <section class="auth-card">
      <a class="brand-link" href="./index.html">أكاديمية التفوق</a>
      <p class="eyebrow">بوابة الأستاذ</p>
      <h1>مرحباً بك</h1>
      <p>سجّل الدخول لإدارة التلاميذ والمواد والحصص المباشرة.</p>
      <form id="teacher-login-form" class="stack-form">
        <label for="teacher-passcode">رمز دخول الأستاذ</label>
        <input id="teacher-passcode" type="password" autocomplete="current-password" required />
        <p id="login-error" class="form-error" hidden aria-live="polite"></p>
        <button class="cta-button cta-teacher" type="submit">دخول</button>
      </form>
    </section>
  </main>
  <script src="./js/teacher-login.js"></script>
</body>
</html>
