<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دخول الولي | أكاديمية التفوق</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body class="app-shell">
  <main class="auth-layout">
    <section class="auth-card">
      <a class="brand-link" href="./index.html">أكاديمية التفوق</a>
      <p class="eyebrow">بوابة الولي</p>
      <h1>متابعة التقدم</h1>
      <p>اطلع على ملفات طفلك، حضوره، وتفاصيل الحصة المباشرة.</p>
      <form id="parent-login-form" class="stack-form">
        <label for="parent-phone">رقم هاتف الولي</label>
        <input id="parent-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="05xxxxxxxx" required />
        <p id="login-error" class="form-error" hidden aria-live="polite"></p>
        <button class="cta-button cta-secondary" type="submit">دخول</button>
      </form>
      <p class="muted">سجّل تلميذاً جديداً أولاً إن لم يكن الرقم مسجلاً.</p>
    </section>
  </main>
  <script src="./js/parent-login.js"></script>
</body>
</html>
