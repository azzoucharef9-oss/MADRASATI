<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="مشاهدة الحصة المباشرة في أكاديمية التفوق للفيزياء والرياضيات."
    />
    <title>الحصة المباشرة | أكاديمية التفوق</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />

    <style>
      :root {
        --viewer-bg: #0f172a;
        --viewer-surface: rgba(30, 41, 59, 0.84);
        --viewer-border: rgba(148, 163, 184, 0.2);
        --viewer-text: #e2e8f0;
        --viewer-muted: #94a3b8;
        --viewer-blue: #3b82f6;
        --viewer-blue-dark: #2563eb;
        --viewer-green: #22c55e;
        --viewer-amber: #f59e0b;
        --viewer-red: #ef4444;
      }

      .student-live-page {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        overflow-y: auto;
        color: var(--viewer-text);
        background:
          radial-gradient(circle at 82% 0%, rgba(37, 99, 235, 0.13), transparent 27rem),
          var(--viewer-bg);
      }

      .student-live-page *,
      .student-live-page *::before,
      .student-live-page *::after {
        box-sizing: border-box;
      }

      .student-live-page button {
        font: inherit;
      }

      .viewer-shell {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        min-height: 100vh;
      }

      .viewer-header {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        min-height: 4.35rem;
        padding: 0.75rem clamp(1rem, 4vw, 3rem);
        background: rgba(15, 23, 42, 0.84);
        border-bottom: 1px solid var(--viewer-border);
      }

      .viewer-brand {
        display: inline-flex;
        align-items: center;
        gap: 0.68rem;
        min-width: 0;
      }

      .viewer-brand-mark {
        display: grid;
        width: 2.4rem;
        height: 2.4rem;
        flex: 0 0 auto;
        place-items: center;
        color: #ffffff;
        background: linear-gradient(135deg, var(--viewer-blue), #1d4ed8);
        border-radius: 0.75rem;
        box-shadow: 0 7px 18px rgba(37, 99, 235, 0.22);
      }

      .viewer-brand-mark svg {
        width: 1.42rem;
        height: 1.42rem;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .viewer-brand-copy {
        display: grid;
        min-width: 0;
        line-height: 1.28;
      }

      .viewer-brand-copy strong {
        overflow: hidden;
        font-size: 0.9rem;
        font-weight: 800;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .viewer-brand-copy small {
        margin-top: 0.1rem;
        color: var(--viewer-muted);
        font-size: 0.68rem;
        font-weight: 600;
      }

      .viewer-level {
        display: inline-flex;
        align-items: center;
        gap: 0.42rem;
        max-width: 50%;
        padding: 0.43rem 0.66rem;
        color: #bfdbfe;
        background: rgba(59, 130, 246, 0.11);
        border: 1px solid rgba(96, 165, 250, 0.24);
        border-radius: 0.6rem;
        font-size: 0.74rem;
        font-weight: 700;
      }

      .viewer-level svg {
        width: 1rem;
        height: 1rem;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      #class-level-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .viewer-stage {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(19rem, 23rem);
        grid-template-areas: "video chat";
        align-items: stretch;
        min-height: 0;
        gap: clamp(0.8rem, 1.7vw, 1.5rem);
        padding: clamp(0.8rem, 2vw, 1.5rem) clamp(0.8rem, 3vw, 2.5rem);
      }

      .video-frame {
        position: relative;
        grid-area: video;
        display: grid;
        width: 100%;
        height: min(75vh, calc(100vh - 11.5rem));
        min-height: 23rem;
        overflow: hidden;
        place-items: center;
        background: #020617;
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 1rem;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
      }

      #remote-video {
        display: block;
        width: 100%;
        height: 100%;
        background: #020617;
        object-fit: contain;
      }

      .remote-audio-toggle {
        position: absolute;
        z-index: 14;
        right: 50%;
        bottom: 1rem;
        min-height: 2.7rem;
        padding: 0.62rem 0.95rem;
        color: #ffffff;
        background: rgba(37, 99, 235, 0.94);
        border: 1px solid rgba(191, 219, 254, 0.55);
        border-radius: 0.7rem;
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.32);
        font: inherit;
        font-size: 0.78rem;
        font-weight: 800;
        cursor: pointer;
        transform: translateX(50%);
      }

      .remote-audio-toggle[hidden] {
        display: none;
      }

      #student-canvas {
        position: absolute;
        inset: 0;
        z-index: 10;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .video-placeholder {
        position: absolute;
        display: grid;
        max-width: 24rem;
        padding: 1.5rem;
        place-items: center;
        color: var(--viewer-muted);
        text-align: center;
        pointer-events: none;
      }

      .video-placeholder[hidden] {
        display: none;
      }

      .placeholder-icon {
        display: grid;
        width: 4.2rem;
        height: 4.2rem;
        margin-bottom: 0.9rem;
        place-items: center;
        color: #60a5fa;
        background: rgba(59, 130, 246, 0.12);
        border: 1px solid rgba(59, 130, 246, 0.22);
        border-radius: 1.2rem;
      }

      .placeholder-icon svg {
        width: 2rem;
        height: 2rem;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.6;
      }

      .video-placeholder strong {
        color: #dbeafe;
        font-size: 0.96rem;
        font-weight: 800;
      }

      .video-placeholder p {
        margin: 0.34rem 0 0;
        font-size: 0.77rem;
        font-weight: 500;
        line-height: 1.8;
      }

      .student-chat-panel {
        position: relative;
        z-index: 1;
        grid-area: chat;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        width: 100%;
        height: clamp(18rem, 42vh, 29rem);
        min-height: 0;
        max-height: 29rem;
        overflow: hidden;
        color: var(--viewer-text);
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 1rem;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(12px);
      }

      .student-chat-head {
        padding: 0.65rem 0.75rem 0.45rem;
        border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      }

      .student-chat-head h2 {
        margin: 0;
        color: #e2e8f0;
        font-size: 0.75rem;
        font-weight: 800;
      }

      .student-chat-box {
        display: flex;
        flex-direction: column;
        gap: 0.48rem;
        min-height: 0;
        padding: 0.55rem 0.65rem;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
        scrollbar-width: thin;
        scrollbar-color: rgba(148, 163, 184, 0.55) transparent;
      }

      /* This flexible spacer keeps short conversations at the bottom. Once
         messages fill the available height it collapses, allowing true scroll. */
      .student-chat-box::before {
        content: "";
        flex: 1 0 0;
      }

      .student-chat-box > * {
        flex: 0 0 auto;
      }

      .student-chat-empty {
        margin: auto 0;
        color: var(--viewer-muted);
        font-size: 0.64rem;
        font-weight: 600;
        line-height: 1.75;
        text-align: center;
      }

      .student-chat-message {
        max-width: 92%;
        padding: 0.46rem 0.55rem;
        color: #e2e8f0;
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 0.62rem;
      }

      .student-chat-message.own-message {
        justify-self: start;
        background: rgba(30, 64, 175, 0.34);
        border-color: rgba(96, 165, 250, 0.3);
      }

      .student-chat-message.teacher-reply {
        justify-self: end;
        background: rgba(20, 83, 45, 0.4);
        border-color: rgba(74, 222, 128, 0.26);
      }

      .student-chat-sender {
        display: block;
        margin-bottom: 0.12rem;
        color: #bfdbfe;
        font-size: 0.59rem;
        font-weight: 800;
      }

      .teacher-reply .student-chat-sender {
        color: #86efac;
      }

      .student-chat-body {
        display: block;
        overflow-wrap: anywhere;
        font-size: 0.68rem;
        font-weight: 600;
        line-height: 1.65;
      }

      .student-chat-form {
        display: flex;
        gap: 0.38rem;
        padding: 0.5rem 0.6rem 0.6rem;
        border-top: 1px solid rgba(148, 163, 184, 0.12);
      }

      .student-chat-form input {
        min-width: 0;
        flex: 1;
        min-height: 2.15rem;
        padding: 0.42rem 0.52rem;
        color: #e2e8f0;
        background: rgba(51, 65, 85, 0.52);
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 0.5rem;
        font: inherit;
        font-size: 0.66rem;
        font-weight: 600;
        outline: 0;
      }

      .student-chat-form input:focus {
        border-color: #60a5fa;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
      }

      .student-chat-send {
        min-width: 3.8rem;
        min-height: 2.15rem;
        padding: 0.4rem 0.48rem;
        color: #ffffff;
        background: #2563eb;
        border: 0;
        border-radius: 0.5rem;
        font: inherit;
        font-size: 0.66rem;
        font-weight: 800;
        cursor: pointer;
      }

      .student-chat-send:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .viewer-controls-wrap {
        position: relative;
        z-index: 3;
        display: grid;
        gap: 0.55rem;
        padding: 0.8rem 1rem 1rem;
        background: linear-gradient(to top, rgba(2, 6, 23, 0.97), rgba(2, 6, 23, 0.74));
        border-top: 1px solid var(--viewer-border);
      }

      .viewer-controls {
        display: grid;
        grid-template-columns: repeat(3, minmax(9rem, 1fr));
        width: min(100%, 47rem);
        margin: 0 auto;
        padding: 0.5rem;
        gap: 0.55rem;
        background: rgba(15, 23, 42, 0.88);
        border: 1px solid var(--viewer-border);
        border-radius: 1rem;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(14px);
      }

      .viewer-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        gap: 0.44rem;
        min-height: 3.1rem;
        padding: 0.7rem 0.8rem;
        color: #dbeafe;
        background: rgba(51, 65, 85, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 0.7rem;
        font-size: 0.78rem;
        font-weight: 800;
        white-space: nowrap;
        cursor: pointer;
        transition: all 0.25s ease;
      }

      .viewer-button svg {
        width: 1.1rem;
        height: 1.1rem;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.9;
      }

      .viewer-button:hover:not(:disabled) {
        transform: translateY(-0.14rem);
        filter: brightness(1.1);
      }

      .viewer-button:focus-visible {
        outline: 3px solid rgba(96, 165, 250, 0.62);
        outline-offset: 3px;
      }

      .viewer-button:disabled {
        opacity: 0.62;
        cursor: not-allowed;
      }

      .viewer-button.primary {
        color: #ffffff;
        background: linear-gradient(135deg, var(--viewer-blue), var(--viewer-blue-dark));
        border-color: transparent;
        box-shadow: 0 7px 16px rgba(37, 99, 235, 0.24);
      }

      .viewer-button.hand-raised {
        color: #fef3c7;
        background: rgba(180, 83, 9, 0.65);
        border-color: rgba(251, 191, 36, 0.33);
      }

      .viewer-button.mic-active {
        color: #bbf7d0;
        background: rgba(20, 83, 45, 0.8);
        border-color: rgba(74, 222, 128, 0.28);
      }

      .viewer-status {
        position: static;
        justify-self: center;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        max-width: min(100%, 38rem);
        padding: 0.4rem 0.7rem;
        color: var(--viewer-muted);
        background: rgba(15, 23, 42, 0.62);
        border-radius: 0.5rem;
        font-size: 0.68rem;
        font-weight: 600;
        pointer-events: none;
      }

      .viewer-status-dot {
        width: 0.42rem;
        height: 0.42rem;
        flex: 0 0 auto;
        background: #64748b;
        border-radius: 50%;
      }

      .viewer-status.is-live {
        color: #bbf7d0;
      }

      .viewer-status.is-live .viewer-status-dot {
        background: var(--viewer-green);
        box-shadow: 0 0 0 0.2rem rgba(34, 197, 94, 0.12);
      }

      .viewer-status.is-warning {
        color: #fde68a;
      }

      .viewer-status.is-warning .viewer-status-dot {
        background: var(--viewer-amber);
      }

      .viewer-status.is-error {
        color: #fecaca;
      }

      .viewer-status.is-error .viewer-status-dot {
        background: var(--viewer-red);
      }

      @media (max-width: 68rem) {
        .viewer-shell {
          grid-template-rows: auto auto auto;
        }

        .viewer-stage {
          grid-template-columns: minmax(0, 1fr);
          grid-template-areas:
            "video"
            "chat";
          align-items: start;
        }

        .video-frame {
          height: min(66vh, 42rem);
        }

        .student-chat-panel {
          height: 18rem;
          min-height: 0;
          max-height: 18rem;
        }
      }

      @media (max-width: 44rem) {
        .viewer-header {
          min-height: 4rem;
          padding: 0.65rem 0.9rem;
        }

        .viewer-stage {
          gap: 0.75rem;
          padding: 0.7rem;
        }

        .video-frame {
          height: min(56vh, 28rem);
          min-height: 16rem;
          border-radius: 0.8rem;
        }

        .student-chat-panel {
          height: 17rem;
          min-height: 0;
          max-height: 17rem;
          border-radius: 0.8rem;
        }

        .viewer-controls-wrap {
          position: sticky;
          bottom: 0;
          padding: 0.65rem 0.7rem calc(0.7rem + env(safe-area-inset-bottom));
        }

        .viewer-controls {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          width: 100%;
          gap: 0.45rem;
          padding: 0.4rem;
        }

        .viewer-button {
          min-height: 3.25rem;
          padding: 0.6rem 0.45rem;
          font-size: 0.72rem;
        }

        .viewer-status {
          max-width: 100%;
          font-size: 0.65rem;
          text-align: center;
        }
      }

      @media (max-width: 29rem) {
        .viewer-brand-copy small {
          display: none;
        }

        .viewer-level {
          max-width: 48%;
          font-size: 0.65rem;
        }

        .video-frame {
          height: min(52vh, 23rem);
          min-height: 14rem;
        }

        .viewer-controls {
          grid-template-columns: minmax(0, 1fr);
        }

        .remote-audio-toggle {
          bottom: 0.65rem;
          max-width: calc(100% - 1.2rem);
          font-size: 0.7rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .student-live-page *,
        .student-live-page *::before,
        .student-live-page *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body class="student-live-page">
    <div class="viewer-shell">
      <header class="viewer-header">
        <div class="viewer-brand">
          <span class="viewer-brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3.5 8 12 3.75 20.5 8 12 12.25 3.5 8Z" /><path d="M6.5 9.5v5.9c3.1 2.25 7.9 2.25 11 0V9.5" /></svg>
          </span>
          <span class="viewer-brand-copy">
            <strong>أكاديمية التفوق</strong>
            <small>الحصة المباشرة</small>
          </span>
        </div>

        <div class="viewer-level" aria-label="المستوى الدراسي">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.75 5.75A1.75 1.75 0 0 1 6.5 4h11A1.75 1.75 0 0 1 19.25 5.75v9.5A1.75 1.75 0 0 1 17.5 17h-11a1.75 1.75 0 0 1-1.75-1.75v-9.5ZM9 20h6M12 17v3" /></svg>
          <span id="class-level-label">الحصة المباشرة</span>
        </div>
      </header>

      <main class="viewer-stage" aria-label="مشاهدة الحصة المباشرة">
        <div class="video-frame">
          <video id="remote-video" autoplay muted playsinline controls aria-label="بث الأستاذ المباشر"></video>
          <button id="enable-audio-btn" class="remote-audio-toggle" type="button" hidden>تشغيل صوت الأستاذ</button>

          <div id="video-placeholder" class="video-placeholder">
            <span class="placeholder-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4.75 5.75A1.75 1.75 0 0 1 6.5 4h11A1.75 1.75 0 0 1 19.25 5.75v9.5A1.75 1.75 0 0 1 17.5 17h-11a1.75 1.75 0 0 1-1.75-1.75v-9.5ZM9 20h6M12 17v3" /><path d="m10 8 5 3.5-5 3.5V8Z" /></svg>
            </span>
            <strong id="placeholder-title">انضم إلى الحصة عند جاهزيتك</strong>
            <p id="placeholder-description">ستظهر مشاركة الأستاذ هنا بعد بدء البث.</p>
          </div>
        </div>

        <aside class="student-chat-panel" aria-labelledby="student-chat-title">
          <header class="student-chat-head">
            <h2 id="student-chat-title">طرح سؤال على الأستاذ</h2>
          </header>
          <div id="chat-box" class="student-chat-box" aria-live="polite" aria-label="أسئلتك وردود الأستاذ">
            <p id="chat-empty" class="student-chat-empty">اكتب سؤالك وسيظهر رد الأستاذ هنا.</p>
          </div>
          <form id="chat-form" class="student-chat-form" novalidate>
            <input id="chat-input" type="text" maxlength="800" placeholder="اكتب سؤالك..." autocomplete="off" aria-label="سؤالك للأستاذ" disabled />
            <button id="chat-send-btn" class="student-chat-send" type="submit" disabled>إرسال</button>
          </form>
        </aside>
      </main>

      <div class="viewer-controls-wrap">
        <div class="viewer-controls" aria-label="أدوات الحصة">
          <button id="join-class-btn" class="viewer-button primary" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.75A1.75 1.75 0 0 1 6.75 3h6.5A1.75 1.75 0 0 1 15 4.75v6.5A1.75 1.75 0 0 1 13.25 13h-6.5A1.75 1.75 0 0 1 5 11.25v-6.5ZM15 8l4-2v12l-4-2" /></svg>
            <span>انضمام للحصة</span>
          </button>

          <button id="raise-hand-btn" class="viewer-button" type="button" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 11V5.75a1.25 1.25 0 0 1 2.5 0V10M11 10V4.75a1.25 1.25 0 0 1 2.5 0V10.5M13.5 10.5V6.75a1.25 1.25 0 0 1 2.5 0V12M8.5 9.5 7 8.25a1.25 1.25 0 0 0-1.7 1.84l3.2 3.11V16a4.5 4.5 0 0 0 9 0v-4.5" /></svg>
            <span>رفع اليد</span>
          </button>

          <!-- Must remain fully hidden until the teacher sends permission_granted. -->
          <button id="toggle-mic-btn" class="viewer-button" type="button" style="display: none">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 0 0 15.5 12V6.5a3.5 3.5 0 0 0-7 0V12a3.5 3.5 0 0 0 3.5 3.5ZM5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M8.5 21h7" /></svg>
            <span>إيقاف المايك</span>
          </button>
        </div>

        <div id="viewer-status" class="viewer-status" role="status" aria-live="polite">
          <span class="viewer-status-dot" aria-hidden="true"></span>
          <span id="viewer-status-text">جاهز للانضمام</span>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="./js/student-live.js"></script>
  </body>
</html>
